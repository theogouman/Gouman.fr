<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finder — public</title>
<style>
  /* ============================================================
     Fenêtre Finder macOS (Liquid Glass, sombre)
     Unité de base : 1px = 1pt macOS. Taille réelle : 449 × 319.
     Les colonnes Taille et Type gardent leurs coordonnées d'origine (447 et
     544) : à cette largeur elles tombent au-delà du bord et sont rognées,
     exactement comme le Finder le fait quand on retrécit la fenêtre.
     Changez --scale pour agrandir sans perte de netteté.
     ============================================================ */
  :root {
    --scale: 2;

    /* Grille de la liste. La hauteur de ligne commande tout le reste : la
       trame zebree, la hauteur du groupe replie, celle de la fenetre et la
       position de la barre de chemin. Un ecran tactile l'epaissit (classe
       .tactile posee par index.html) pour agrandir la cible du doigt. */
    --rh: 20px;
    --lignes: 10;

    --win-bg: #1e1e1e;
    --glass-bg: rgba(255, 255, 255, 0.075);
    --glass-pill: rgba(255, 255, 255, 0.13);
    --stripe: rgba(255, 255, 255, 0.04);
    --select: #2a5bd2;

    --text: #ececec;
    --text-2: #c9c9c9;
    --text-3: #8d8d8d;
    --icon: #e6e6e6;
    /* Les logos de marque sont reduits a deux tons : la silhouette et le creux.
       Le creux reprend le fond de la fenetre, comme une vraie icone decoupee. */
    --glyph: #d9d9d9;
    --glyph-creux: var(--win-bg);
    --hairline: rgba(255, 255, 255, 0.09);

    --font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
            "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mise en page de cette page de previsualisation uniquement : le scopeur de
     scripts/build-finder.mjs jette cette regle lors de l'injection dans le site. */
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
  }

  .finder { zoom: var(--scale); padding: 40px; }

  /* ---------- Fenêtre ---------- */
  /* Sur un ecran tactile la fenetre est reduite pour tenir : les lignes
     s'epaississent d'autant, sinon la cible du doigt ne fait plus que 16 px.
     La maquette ne peut pas porter de media query (la capture du genie y
     repondrait a la mauvaise largeur), c'est donc index.html qui decide. */
  .window.tactile { --rh: 30px; }

  .window {
    position: relative;
    width: 449px;
    /* 85.5 de barre d'outils et d'en-tetes, la liste, 6 de marge, 27.5 de
       barre de chemin : 319 a la hauteur de ligne d'origine. */
    height: calc(119px + var(--lignes) * var(--rh));
    border-radius: 28px;
    background: var(--win-bg);
    overflow: hidden;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    letter-spacing: -0.08px;
    user-select: none;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.16),
      0 24px 60px rgba(0, 0, 0, 0.32),
      0 8px 20px rgba(0, 0, 0, 0.22);
  }

  svg { display: block; overflow: visible; }

  .traffic {
    position: absolute;
    top: 19.5px; left: 19px;
    display: flex; gap: 9px;
    z-index: 5;
  }
  .traffic span {
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
  }
  .traffic .r { background: #ff5f57; }
  .traffic .y { background: #febc2e; }
  .traffic .g { background: #28c840; }

  /* ---------- Toolbar ---------- */
  .glass {
    position: absolute;
    top: 8.5px; height: 36px;
    border-radius: 18px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.2),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.07),
      0 0 0 0.5px rgba(0, 0, 0, 0.35),
      0 1px 4px rgba(0, 0, 0, 0.25);
    color: var(--icon);
  }
  .glass .ic {
    position: absolute; top: 8px;
    width: 20px; height: 20px;
    transform: translateX(-50%);
  }

  .nav { left: 96px; width: 73px; }
  .nav .sep {
    position: absolute; left: 36.5px; top: 10px;
    width: 0.5px; height: 16px; background: rgba(255, 255, 255, 0.14);
  }
  .nav .dim { color: #7c7c7c; }

  .title {
    position: absolute; left: 182px; top: 8.5px;
    line-height: 36px;
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.2px;
    color: #f2f2f2;
  }

  /* Trop etroite pour les groupes d'actions : le Finder les replie derriere
     un chevron double, comme ici. */
  .plus { left: 359px; width: 36px; }

  /* ---------- Recherche ----------
     La pastille de la loupe s'etire vers la gauche et devient un champ. Son
     bord droit ne bouge pas : left et width varient ensemble, leur somme
     reste a 440. C'est une animation de mise en page, mais sur un element
     absolu de 36px de haut, isole dans son coin de la barre d'outils. */
  .search {
    left: 404px; width: 36px;
    transition: left 340ms cubic-bezier(0.32, 0.72, 0, 1),
                width 340ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .search.ouverte { left: 182px; width: 258px; }

  /* La loupe reste calee a droite, elle ne bouge pas d'un pixel pendant que
     la pastille s'ouvre : c'est elle qui donne l'impression du morphisme. */
  .loupe {
    position: absolute; right: 0; top: 0;
    width: 36px; height: 36px;
    border: 0; background: none;
    color: inherit; cursor: pointer;
  }
  .loupe .ic { left: 18px; }

  .champ {
    position: absolute; left: 15px; right: 34px; top: 0;
    height: 36px;
    border: 0; background: none;
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: 13px;
    color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity 140ms linear;
  }
  /* Le texte n'arrive qu'une fois la pastille presque ouverte. */
  .search.ouverte .champ {
    opacity: 1; pointer-events: auto;
    transition-delay: 140ms;
  }
  /* Seul endroit de la page ou l'on selectionne du texte. */
  .champ { -webkit-user-select: text; user-select: text; }
  .champ::placeholder { color: var(--text-3); }
  .champ:focus { outline: none; }
  .champ::-webkit-search-decoration,
  .champ::-webkit-search-cancel-button { -webkit-appearance: none; }
  /* Sous 16px, iOS zoome la page a la mise au point du champ. On ne paie ce
     corps plus grand que la ou le probleme existe. */
  .window.tactile .champ { font-size: 16px; }

  /* Le titre et le groupe d'actions cedent la place au champ. */
  .title, .plus { transition: opacity 200ms ease; }
  .window.cherche .title,
  .window.cherche .plus { opacity: 0; pointer-events: none; }

  /* ---------- Liste ---------- */
  .head {
    position: absolute; left: 0; right: 0; top: 56px;
    height: 24px;
    border-bottom: 0.5px solid var(--hairline);
    font-size: 12px;
  }
  .head span { position: absolute; top: 0; line-height: 19px; }
  .head .h-name { left: 48px; font-weight: 600; color: var(--text); }
  .head .h-size { left: 447px; font-weight: 500; color: var(--text-3); }
  .head .h-type { left: 544px; font-weight: 500; color: var(--text-3); }
  .head .sort   { left: 422px; top: 5.5px; color: var(--text-3); }
  .head .div {
    position: absolute; top: 2px; width: 0.5px; height: 15px;
    background: rgba(255, 255, 255, 0.13);
  }

  /* La trame alternee est peinte par un degrade repete sur la liste, pas par
     les lignes : elle reste ainsi accrochee a la position a l'ecran, comme
     dans le Finder, y compris pendant qu'un dossier se replie. */
  .rows {
    position: absolute; left: 0; right: 0; top: 85.5px;
    height: calc(var(--lignes) * var(--rh));
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 var(--rh),
      var(--stripe) var(--rh) calc(2 * var(--rh)));
  }

  .row {
    position: relative;
    display: block;
    width: 100%;
    border: 0;
    background: none;
    font: inherit;
    height: var(--rh); line-height: var(--rh);
    border-radius: 6px;
    color: var(--text);
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .row:hover { background: rgba(255, 255, 255, 0.08); }
  .row:active,
  .row:focus-visible { background: var(--select); outline: none; }
  .row:active .name,
  .row:focus-visible .name { color: #fff; }

  /* Les deux icones restent centrees quelle que soit la hauteur de ligne. */
  .row .disc  { position: absolute; left: 16px; top: calc((var(--rh) - 10px) / 2); width: 7px; height: 10px; color: #b5b5b5; }
  .row .ficon { position: absolute; left: 27px; top: calc((var(--rh) - 16px) / 2); width: 16px; height: 16px; }
  /* top explicite : sans lui le nom se poserait a sa position statique,
     qui depend du formatage du markup de la ligne. */
  .row .name  { position: absolute; left: 48px; top: 0; color: var(--text); }

  /* Un cran d'indentation pour le contenu d'un dossier. */
  .row.enfant .ficon { left: 43px; }
  .row.enfant .name  { left: 64px; }

  /* Repliement : toutes les lignes font la meme hauteur, celle du groupe est
     donc connue et animable. Le triangle pivote en meme temps, comme dans le
     Finder. */
  .enfants {
    overflow: hidden;
    height: calc(var(--n) * var(--rh));
    visibility: visible;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s;
  }
  /* visibility bascule une fois le repliement fini : les liens caches sortent
     ainsi de l'ordre de tabulation, sans disparaitre pendant l'animation. */
  .dossier[aria-expanded="false"] + .enfants {
    height: 0;
    visibility: hidden;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s 240ms;
  }

  .dossier .disc {
    transform: rotate(90deg);
    transform-origin: 50% 50%;
    transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .dossier[aria-expanded="false"] .disc { transform: rotate(0); }

  /* Une ligne que la recherche ecarte quitte la liste : les suivantes
     remontent, et la trame zebree reste accrochee a l'ecran. */
  .row.filtre { display: none; }

  .vide {
    position: absolute; left: 0; right: 0; top: calc(2 * var(--rh));
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
    display: none;
  }
  .window.sans-resultat .vide { display: block; }

  /* Replier un groupe fait remonter les lignes qui le suivent. A l'echelle
     reduite du mobile ce deplacement tombe entre deux pixels de l'ecran : le
     navigateur repeint alors les icones a chaque image et elles vibrent.
     Chaque ligne est donc promue sur sa propre couche le temps du repliement,
     que le compositeur deplace telle quelle au lieu de la redessiner.
     index.html pose .replie au clic et la retire une fois l'animation finie :
     la promotion ne dure que ces 240 ms, et surtout elle n'est jamais presente
     quand genie.js rasterise la fenetre, ou une transformation 3D dans un
     foreignObject est un pari. */
  .window.replie .row {
    transform: translateZ(0);
    backface-visibility: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    .enfants,
    .dossier .disc { transition: none; }
  }

  /* ---------- Barre de chemin ---------- */
  .pathbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: calc(91.5px + var(--lignes) * var(--rh));
    border-top: 0.5px solid var(--hairline);
    display: flex; align-items: center;
    padding-left: 14px;
    font-size: 11.5px;
    color: #b4b4b4;
  }
  .crumb { display: flex; align-items: center; gap: 5px; }
  .crumb svg { width: 12px; height: 12px; }
  .chev { width: 6px; height: 8px; margin: 0 5px 0 5px; color: #8a8a8a; }
</style>
</head>
