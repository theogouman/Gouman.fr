<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finder — public</title>
<style>
  /* ============================================================
     Fenêtre Finder macOS (Liquid Glass, sombre)
     Unité de base : 1px = 1pt macOS. Taille réelle : 449 × 319.
     Les colonnes Taille et Type gardent leurs coordonnées d'origine (447 et
     544) : à cette largeur elles tombent au-delà du bord et sont rognées,
     exactement comme le Finder le fait quand on retrécit la fenêtre.
     Changez --scale pour agrandir sans perte de netteté.
     ============================================================ */
  :root {
    --scale: 2;

    --win-bg: #1e1e1e;
    --glass-bg: rgba(255, 255, 255, 0.075);
    --glass-pill: rgba(255, 255, 255, 0.13);
    --stripe: rgba(255, 255, 255, 0.04);
    --select: #2a5bd2;

    --text: #ececec;
    --text-2: #c9c9c9;
    --text-3: #8d8d8d;
    --icon: #e6e6e6;
    --hairline: rgba(255, 255, 255, 0.09);

    --font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
            "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mise en page de cette page de previsualisation uniquement : le scopeur de
     scripts/build-finder.mjs jette cette regle lors de l'injection dans le site. */
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
  }

  .finder { zoom: var(--scale); padding: 40px; }

  /* ---------- Fenêtre ---------- */
  .window {
    position: relative;
    width: 449px;
    height: 319px;
    border-radius: 28px;
    background: var(--win-bg);
    overflow: hidden;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    letter-spacing: -0.08px;
    user-select: none;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.16),
      0 24px 60px rgba(0, 0, 0, 0.32),
      0 8px 20px rgba(0, 0, 0, 0.22);
  }

  svg { display: block; overflow: visible; }

  .traffic {
    position: absolute;
    top: 19.5px; left: 19px;
    display: flex; gap: 9px;
    z-index: 5;
  }
  .traffic span {
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
  }
  .traffic .r { background: #ff5f57; }
  .traffic .y { background: #febc2e; }
  .traffic .g { background: #28c840; }

  /* ---------- Toolbar ---------- */
  .glass {
    position: absolute;
    top: 8.5px; height: 36px;
    border-radius: 18px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.2),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.07),
      0 0 0 0.5px rgba(0, 0, 0, 0.35),
      0 1px 4px rgba(0, 0, 0, 0.25);
    color: var(--icon);
  }
  .glass .ic {
    position: absolute; top: 8px;
    width: 20px; height: 20px;
    transform: translateX(-50%);
  }

  .nav { left: 96px; width: 73px; }
  .nav .sep {
    position: absolute; left: 36.5px; top: 10px;
    width: 0.5px; height: 16px; background: rgba(255, 255, 255, 0.14);
  }
  .nav .dim { color: #7c7c7c; }

  .title {
    position: absolute; left: 182px; top: 8.5px;
    line-height: 36px;
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.2px;
    color: #f2f2f2;
  }

  /* Trop etroite pour les groupes d'actions : le Finder les replie derriere
     un chevron double, comme ici. */
  .plus   { left: 359px; width: 36px; }
  .search { left: 404px; width: 36px; }

  /* ---------- Liste ---------- */
  .head {
    position: absolute; left: 0; right: 0; top: 56px;
    height: 24px;
    border-bottom: 0.5px solid var(--hairline);
    font-size: 12px;
  }
  .head span { position: absolute; top: 0; line-height: 19px; }
  .head .h-name { left: 48px; font-weight: 600; color: var(--text); }
  .head .h-size { left: 447px; font-weight: 500; color: var(--text-3); }
  .head .h-type { left: 544px; font-weight: 500; color: var(--text-3); }
  .head .sort   { left: 422px; top: 5.5px; color: var(--text-3); }
  .head .div {
    position: absolute; top: 2px; width: 0.5px; height: 15px;
    background: rgba(255, 255, 255, 0.13);
  }

  /* La trame alternee est peinte par un degrade repete sur la liste, pas par
     les lignes : elle reste ainsi accrochee a la position a l'ecran, comme
     dans le Finder, y compris pendant qu'un dossier se replie. */
  .rows {
    position: absolute; left: 0; right: 0; top: 85.5px;
    height: 200px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 20px,
      var(--stripe) 20px 40px);
  }

  .row {
    position: relative;
    display: block;
    width: 100%;
    border: 0;
    background: none;
    font: inherit;
    height: 20px; line-height: 20px;
    border-radius: 6px;
    color: var(--text);
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .row:hover { background: rgba(255, 255, 255, 0.08); }
  .row:active,
  .row:focus-visible { background: var(--select); outline: none; }
  .row:active .name,
  .row:focus-visible .name { color: #fff; }

  .row .disc  { position: absolute; left: 16px; top: 5px; width: 7px; height: 10px; color: #b5b5b5; }
  .row .ficon { position: absolute; left: 27px; top: 2px; width: 16px; height: 16px; }
  /* top explicite : sans lui le nom se poserait a sa position statique,
     qui depend du formatage du markup de la ligne. */
  .row .name  { position: absolute; left: 48px; top: 0; color: var(--text); }

  /* Un cran d'indentation pour le contenu d'un dossier. */
  .row.enfant .ficon { left: 43px; }
  .row.enfant .name  { left: 64px; }

  /* Repliement : chaque ligne fait 20px, la hauteur du groupe est donc connue
     et animable. Le triangle pivote en meme temps, comme dans le Finder. */
  .enfants {
    overflow: hidden;
    height: calc(var(--n) * 20px);
    visibility: visible;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s;
  }
  /* visibility bascule une fois le repliement fini : les liens caches sortent
     ainsi de l'ordre de tabulation, sans disparaitre pendant l'animation. */
  .dossier[aria-expanded="false"] + .enfants {
    height: 0;
    visibility: hidden;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s 240ms;
  }

  .dossier .disc {
    transform: rotate(90deg);
    transform-origin: 50% 50%;
    transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .dossier[aria-expanded="false"] .disc { transform: rotate(0); }

  @media (prefers-reduced-motion: reduce) {
    .enfants,
    .dossier .disc { transition: none; }
  }

  /* ---------- Barre de chemin ---------- */
  .pathbar {
    position: absolute; left: 0; right: 0; top: 291.5px; bottom: 0;
    border-top: 0.5px solid var(--hairline);
    display: flex; align-items: center;
    padding-left: 14px;
    font-size: 11.5px;
    color: #b4b4b4;
  }
  .crumb { display: flex; align-items: center; gap: 5px; }
  .crumb svg { width: 12px; height: 12px; }
  .chev { width: 6px; height: 8px; margin: 0 5px 0 5px; color: #8a8a8a; }
</style>
</head>
