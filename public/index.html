<html lang="fr">

  <style id="finder-css">
    /* finder:css:start */

  /* ============================================================
     Fenêtre Finder macOS (Liquid Glass, sombre)
     Unité de base : 1px = 1pt macOS. Taille réelle : 449 × 319.
     Les colonnes Taille et Type gardent leurs coordonnées d'origine (447 et
     544) : à cette largeur elles tombent au-delà du bord et sont rognées,
     exactement comme le Finder le fait quand on retrécit la fenêtre.
     Changez --scale pour agrandir sans perte de netteté.
     ============================================================ */
  .finder-win {
    --scale: 2;

    /* Grille de la liste. La hauteur de ligne commande tout le reste : la
       trame zebree, la hauteur du groupe replie, celle de la fenetre et la
       position de la barre de chemin. Un ecran tactile l'epaissit (classe
       .tactile posee par index.html) pour agrandir la cible du doigt. */
    --rh: 20px;
    --lignes: 10;

    --win-bg: #1e1e1e;
    --glass-bg: rgba(255, 255, 255, 0.075);
    --glass-pill: rgba(255, 255, 255, 0.13);
    --stripe: rgba(255, 255, 255, 0.04);
    --select: #2a5bd2;

    --text: #ececec;
    --text-2: #c9c9c9;
    --text-3: #8d8d8d;
    --icon: #e6e6e6;
    /* Les logos de marque sont reduits a deux tons : la silhouette et le creux.
       Le creux reprend le fond de la fenetre, comme une vraie icone decoupee. */
    --glyph: #d9d9d9;
    --glyph-creux: var(--win-bg);
    --hairline: rgba(255, 255, 255, 0.09);

    --font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
            "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .finder-win,

  .finder-win * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mise en page de cette page de previsualisation uniquement : le scopeur de
     scripts/build-finder.mjs jette cette regle lors de l'injection dans le site. */

  /* ---------- Fenêtre ---------- */
  /* Sur un ecran tactile la fenetre est reduite pour tenir : les lignes
     s'epaississent d'autant, sinon la cible du doigt ne fait plus que 16 px.
     La maquette ne peut pas porter de media query (la capture du genie y
     repondrait a la mauvaise largeur), c'est donc index.html qui decide. */
  .finder-win .window.tactile { --rh: 30px; }

  .finder-win .window {
    position: relative;
    width: 449px;
    /* 85.5 de barre d'outils et d'en-tetes, la liste, 6 de marge, 27.5 de
       barre de chemin : 319 a la hauteur de ligne d'origine. */
    height: calc(119px + var(--lignes) * var(--rh));
    border-radius: 28px;
    background: var(--win-bg);
    overflow: hidden;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    letter-spacing: -0.08px;
    user-select: none;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.16),
      0 24px 60px rgba(0, 0, 0, 0.32),
      0 8px 20px rgba(0, 0, 0, 0.22);
  }

  .finder-win svg { display: block; overflow: visible; }

  .finder-win .traffic {
    position: absolute;
    top: 19.5px; left: 19px;
    display: flex; gap: 9px;
    z-index: 5;
  }
  .finder-win .traffic span {
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
  }
  .finder-win .traffic .r { background: #ff5f57; }
  .finder-win .traffic .y { background: #febc2e; }
  .finder-win .traffic .g { background: #28c840; }

  /* ---------- Toolbar ---------- */
  .finder-win .glass {
    position: absolute;
    top: 8.5px; height: 36px;
    border-radius: 18px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.2),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.07),
      0 0 0 0.5px rgba(0, 0, 0, 0.35),
      0 1px 4px rgba(0, 0, 0, 0.25);
    color: var(--icon);
  }
  .finder-win .glass .ic {
    position: absolute; top: 8px;
    width: 20px; height: 20px;
    transform: translateX(-50%);
  }

  .finder-win .nav { left: 96px; width: 73px; }
  .finder-win .nav .sep {
    position: absolute; left: 36.5px; top: 10px;
    width: 0.5px; height: 16px; background: rgba(255, 255, 255, 0.14);
  }
  .finder-win .nav .dim { color: #7c7c7c; }

  /* Trop etroite pour les groupes d'actions : le Finder les replie derriere
     un chevron double, comme ici. */
  .finder-win .plus { left: 359px; width: 36px; }

  /* ---------- Recherche ----------
     La pastille de la loupe s'etire vers la gauche et devient un champ. Son
     bord droit ne bouge pas : left et width varient ensemble, leur somme
     reste a 440. C'est une animation de mise en page, mais sur un element
     absolu de 36px de haut, isole dans son coin de la barre d'outils. */
  .finder-win .search {
    left: 404px; width: 36px;
    transition: left 340ms cubic-bezier(0.32, 0.72, 0, 1),
                width 340ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .finder-win .search.ouverte { left: 182px; width: 258px; }

  /* La loupe reste calee a droite, elle ne bouge pas d'un pixel pendant que
     la pastille s'ouvre : c'est elle qui donne l'impression du morphisme. */
  .finder-win .loupe {
    position: absolute; right: 0; top: 0;
    width: 36px; height: 36px;
    border: 0; background: none;
    color: inherit; cursor: pointer;
  }
  .finder-win .loupe .ic { left: 18px; }

  .finder-win .champ {
    position: absolute; left: 15px; right: 34px; top: 0;
    height: 36px;
    border: 0; background: none;
    -webkit-appearance: none; appearance: none;
    font: inherit; font-size: 13px;
    color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity 140ms linear;
  }
  /* Le texte n'arrive qu'une fois la pastille presque ouverte. */
  .finder-win .search.ouverte .champ {
    opacity: 1; pointer-events: auto;
    transition-delay: 140ms;
  }
  /* Seul endroit de la page ou l'on selectionne du texte. */
  .finder-win .champ { -webkit-user-select: text; user-select: text; }
  .finder-win .champ::placeholder { color: var(--text-3); }
  .finder-win .champ:focus { outline: none; }
  .finder-win .champ::-webkit-search-decoration,
  .finder-win .champ::-webkit-search-cancel-button { -webkit-appearance: none; }
  /* Sous 16px, iOS zoome la page a la mise au point du champ. On ne paie ce
     corps plus grand que la ou le probleme existe. */
  .finder-win .window.tactile .champ { font-size: 16px; }

  /* Le groupe d'actions cede la place au champ. */
  .finder-win .plus { transition: opacity 200ms ease; }
  .finder-win .window.cherche .plus { opacity: 0; pointer-events: none; }

  /* ---------- Liste ---------- */
  .finder-win .head {
    position: absolute; left: 0; right: 0; top: 56px;
    height: 24px;
    border-bottom: 0.5px solid var(--hairline);
    font-size: 12px;
  }
  .finder-win .head span { position: absolute; top: 0; line-height: 19px; }
  .finder-win .head .h-name { left: 48px; font-weight: 600; color: var(--text); }
  .finder-win .head .h-size { left: 447px; font-weight: 500; color: var(--text-3); }
  .finder-win .head .h-type { left: 544px; font-weight: 500; color: var(--text-3); }
  .finder-win .head .sort { left: 422px; top: 5.5px; color: var(--text-3); }
  .finder-win .head .div {
    position: absolute; top: 2px; width: 0.5px; height: 15px;
    background: rgba(255, 255, 255, 0.13);
  }

  /* La trame alternee est peinte par un degrade repete sur la liste, pas par
     les lignes : elle reste ainsi accrochee a la position a l'ecran, comme
     dans le Finder, y compris pendant qu'un dossier se replie. */
  .finder-win .rows {
    position: absolute; left: 0; right: 0; top: 85.5px;
    height: calc(var(--lignes) * var(--rh));
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 var(--rh),
      var(--stripe) var(--rh) calc(2 * var(--rh)));
  }

  .finder-win .row {
    position: relative;
    display: block;
    width: 100%;
    border: 0;
    background: none;
    font: inherit;
    height: var(--rh); line-height: var(--rh);
    border-radius: 6px;
    color: var(--text);
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .finder-win .row:hover { background: rgba(255, 255, 255, 0.08); }
  .finder-win .row:active,
  .finder-win .row:focus-visible { background: var(--select); outline: none; }
  .finder-win .row:active .name,
  .finder-win .row:focus-visible .name { color: #fff; }

  /* Les deux icones restent centrees quelle que soit la hauteur de ligne. */
  .finder-win .row .disc { position: absolute; left: 16px; top: calc((var(--rh) - 10px) / 2); width: 7px; height: 10px; color: #b5b5b5; }
  .finder-win .row .ficon { position: absolute; left: 27px; top: calc((var(--rh) - 16px) / 2); width: 16px; height: 16px; }
  /* top explicite : sans lui le nom se poserait a sa position statique,
     qui depend du formatage du markup de la ligne. */
  .finder-win .row .name { position: absolute; left: 48px; top: 0; color: var(--text); }

  /* Un cran d'indentation pour le contenu d'un dossier. */
  .finder-win .row.enfant .ficon { left: 43px; }
  .finder-win .row.enfant .name { left: 64px; }

  /* Repliement : toutes les lignes font la meme hauteur, celle du groupe est
     donc connue et animable. Le triangle pivote en meme temps, comme dans le
     Finder. */
  .finder-win .enfants {
    overflow: hidden;
    height: calc(var(--n) * var(--rh));
    visibility: visible;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s;
  }
  /* visibility bascule une fois le repliement fini : les liens caches sortent
     ainsi de l'ordre de tabulation, sans disparaitre pendant l'animation. */
  .finder-win .dossier[aria-expanded="false"] + .enfants {
    height: 0;
    visibility: hidden;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s 240ms;
  }

  .finder-win .dossier .disc {
    transform: rotate(90deg);
    transform-origin: 50% 50%;
    transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .finder-win .dossier[aria-expanded="false"] .disc { transform: rotate(0); }

  /* Une ligne que la recherche ecarte quitte la liste : les suivantes
     remontent, et la trame zebree reste accrochee a l'ecran. */
  .finder-win .row.filtre { display: none; }

  .finder-win .vide {
    position: absolute; left: 0; right: 0; top: calc(2 * var(--rh));
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
    display: none;
  }
  .finder-win .window.sans-resultat .vide { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .finder-win .enfants,
    .finder-win .dossier .disc { transition: none; }
  }

  /* ---------- Barre de chemin ---------- */
  .finder-win .pathbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: calc(91.5px + var(--lignes) * var(--rh));
    border-top: 0.5px solid var(--hairline);
    display: flex; align-items: center;
    padding-left: 14px;
    font-size: 11.5px;
    color: #b4b4b4;
  }
  .finder-win .crumb { display: flex; align-items: center; gap: 5px; }
  .finder-win .crumb svg { width: 12px; height: 12px; }
  .finder-win .chev { width: 6px; height: 8px; margin: 0 5px 0 5px; color: #8a8a8a; }

    /* finder:css:end */
  </style>
  <style>
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/sf-pro-display-bold.woff2") format("woff2");
    }
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/sf-pro-display-regular.woff2") format("woff2");
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #F4F1EA;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      /* Rien n'est a copier ici : la selection ne fait que gener, surtout au
         doigt ou un appui un peu long surligne la moitie du titre. Le champ
         de recherche se la redonne. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      --marge: clamp(14px, 3.2vw, 60px);
      /* les mains ne touchent plus le bas de l'ecran */
      --bas: 3vh;
      --bas: 3dvh;
      /* Pleine largeur : la hauteur des mains en decoule, et c'est le titre qui
         cede la place. Le plafond ne mord que sur les fenetres tres plates
         (au-dela de 1.88:1), ou les mains retrecissent au lieu d'etre rognees. */
      --mains-h: min(41.5757vw, 78vh);
      --mains-h: min(41.5757vw, 78dvh);
      --haut: clamp(20px, 2.5vh, 48px);
      --haut: clamp(20px, 2.5dvh, 48px);
      --haut-dispo: calc(100vh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      --haut-dispo: calc(100dvh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      /* Largeur commune au titre et a l'accroche : bornee par la largeur de
         l'ecran, par la hauteur qui reste au-dessus des mains, et par un
         plafond.

         Ce plafond etait en pixels, et c'etait l'erreur : un pixel CSS vaut un
         demi pixel d'ecran quand le navigateur est a 50 % de zoom. Tout le
         reste de la scene est en vw et en dvh, donc insensible au zoom ; le
         plafond, lui, retrecissait de moitie et le titre avec. 31.4vw est la
         proportion validee, relevee sur la page telle qu'elle etait vue. Le
         plancher de 420px ne sert qu'aux fenetres etroites, ou c'est 68.80vw
         qui borne de toute facon. */
      --bloc: min(68.80vw, max(31.4vw, 420px), calc(var(--haut-dispo) * 3.3));
      height: 100vh;
      height: 100dvh;
      padding-bottom: var(--bas);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Le texte et les mains forment un bloc : les mains sont donc toujours
       posees juste sous le texte, et c'est le vide qui se repartit autour.
       Sur mobile, ou les mains sont bridees par la largeur, elles remontent
       ainsi avec le texte au lieu de rester collees en bas. */
    .texte-boite {
      flex: 0 0 auto;
      padding: var(--haut) var(--marge);
      display: flex;
      justify-content: center;
    }

    /* Le titre et l'accroche ont exactement la meme largeur d'encre : leur
       corps est calcule a partir de la largeur du bloc et de la largeur que
       chaque phrase occupe a 1 em (6.1218 em et 17.9229 em). */
    .titre {
      width: var(--bloc);
      text-align: center;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   system-ui, "Helvetica Neue", Arial, sans-serif;
    }

    .nom {
      margin: 0;
      font-weight: 700;
      font-size: calc(var(--bloc) * 0.163351);
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .accroche {
      margin: 0.34em 0 0;
      font-weight: 400;
      font-size: calc(var(--bloc) * 0.055795);
      line-height: 1.3;
      white-space: nowrap;
      color: #BAB7B0;
    }

    /* Le surlignage : un fond bleu qui s'ouvre de gauche a droite, avec une
       poignee a chaque bout. Celle de droite est posee dans le fond, elle le
       suit donc sans etre animee separement. */
    .surlignage {
      position: relative;
      color: #F4F1EA;
    }
    .surlignage .mot { position: relative; }

    .fond {
      position: absolute;
      left: 0;
      top: -0.16em;
      bottom: -0.12em;
      width: 0;
      background: #1A3F94;
      animation: surligner 900ms cubic-bezier(.4, 0, .2, 1) 700ms forwards;
    }

    .poignee {
      position: absolute;
      top: -0.16em;
      bottom: -0.12em;
      width: max(2px, 0.05em);
      background: #2F7BFF;
      opacity: 0;
    }
    .poignee::after {
      content: "";
      position: absolute;
      left: 50%;
      width: max(7px, 0.24em);
      height: max(7px, 0.24em);
      transform: translateX(-50%);
      border-radius: 50%;
      background: #2F7BFF;
    }
    .poignee.gauche        { left: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 260ms forwards; }
    .poignee.gauche::after { bottom: 100%; margin-bottom: max(-2px, -0.05em); }
    .poignee.droite        { right: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 700ms forwards; }
    .poignee.droite::after { top: 100%; margin-top: max(-2px, -0.05em); }

    @keyframes surligner { from { width: 0;   } to { width: 100%; } }
    @keyframes paraitre  { from { opacity: 0; } to { opacity: 1;   } }

    /* Si l'animation n'est pas souhaitee, on affiche directement l'etat final. */
    @media (prefers-reduced-motion: reduce) {
      .fond, .poignee {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
      /* Les halos s'arretent la ou leur retard les place : la plaque garde
         son modele, elle ne bouge plus. */
      .pl-feu { animation-play-state: paused; }
      .dossier-ascii { transition: none; }
    }

    .mains-boite {
      flex: 0 0 auto;
      height: var(--mains-h);
      overflow: hidden;
    }
    .mains {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Les mains : IBM Plex Mono Bold, grille de 320 x 68 caracteres.
       Corps et interlettrage gardent le rapport glyphe/cellule du design. */
    #mains {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 18.281px;
      letter-spacing: 1.280px;
      font-variant-ligatures: none;
    }
    /* ---------- Le dossier, cible de clic ----------
       Le SVG des mains est aria-hidden : un vrai bouton, transparent, est pose
       par dessus la plaque pour la souris, le clavier et les lecteurs d'ecran.
       Il ne peint rien : si sa position prend une image de retard quand la
       page bouge, cela ne se voit pas. Le dessin, lui, est dans le SVG. */
    .dossier-bouton {
      position: absolute;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      border-radius: 23%;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
    }
    .dossier-bouton:focus-visible {
      outline: 2px solid #73D7FF;
      outline-offset: 6px;
    }
    .visuellement-cache {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* La plaque, la lumiere et le dossier forment un seul groupe du dessin :
       l'echelle porte sur les trois a la fois. --pl-base est la taille au
       repos, --pl-geste la reponse au survol et a l'appui.
       Le bouton suit le groupe dans le DOM, pas l'inverse : d'ou le :has(). */
    .dossier-ascii {
      --pl-base: 1;
      --pl-geste: 1;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: scale(calc(var(--pl-base) * var(--pl-geste)));
      transition: transform 260ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    body:has(.dossier-bouton:hover) .dossier-ascii { --pl-geste: 1.03; }
    body:has(.dossier-bouton:active) .dossier-ascii { --pl-geste: 0.97; }

    /* Sur mobile la plaque gagne 8 %. Les mains, elles, gardent leur taille :
       elles touchent les deux bords de l'ecran et le SVG est en « meet », donc
       toute reduction de la boite les en decollerait. */
    @media (max-width: 700px) {
      .dossier-ascii { --pl-base: 1.08; }
    }

    /* Les quatre halos font le tour du contour de la plaque, chacun a sa
       vitesse : leurs tours ne retombent jamais en phase, la lumiere ne se
       repete pas. Ce sont leurs centres qui se deplacent - cx et cy, pas une
       transformation : aucune couche composite n'est creee, et le dessin reste
       net a tout agrandissement. */
    .pl-feu {
      fill: url(#pl-halo);
      animation: tour var(--t) linear infinite;
      animation-delay: var(--r);
    }
    @keyframes tour {
      0%     { cx: 1965.1px; cy: 3729.6px; }
      12.5%  { cx: 2121.0px; cy: 3713.2px; }
      25%    { cx: 2276.9px; cy: 3729.6px; }
      37.5%  { cx: 2317.9px; cy: 3910.1px; }

    /* ---------- La fenetre Finder ---------- */
    .finder-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
      backdrop-filter: blur(20px) saturate(125%);
      /* Fermee, elle reste mise en page : le genie doit pouvoir mesurer et
         rasteriser la fenetre avant le premier clic. Seuls l'affichage et les
         clics sont coupes. */
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease, visibility 0s linear 400ms;
    }
    .finder-overlay.ouvert {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 400ms ease;
    }

    /* Centrage par translation plutot que par grille : la boite de mise en
       page garde sa taille d'origine meme reduite, et une grille devrait alors
       centrer un element plus large qu'elle. Ici le centre tombe toujours au
       bon endroit, quelle que soit l'echelle. */
    .finder-win {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max-content;
      transform: translate(-50%, calc(-50% + var(--finder-dy, 0px)))
                 scale(var(--finder-k, 1));
      transition: transform 260ms ease, opacity 260ms ease;
    }
    /* Repli quand le genie ne tourne pas (WebGL absent, capture ratee,
       prefers-reduced-motion) : un simple fondu avec un leger retrait. */
    .finder-overlay:not(.ouvert):not(.anime) .finder-win {
      transform: translate(-50%, calc(-50% + var(--finder-dy, 0px)))
                 scale(calc(var(--finder-k, 1) * 0.92));
      opacity: 0;
    }
    /* Pendant le genie, la fenetre est dessinee par le canvas. */
    .finder-overlay.anime .finder-win { visibility: hidden; }

    .genie-canvas {
      position: fixed;
      inset: 0;
      z-index: 45;
      pointer-events: none;
      opacity: 0;
    }

    #mains .t0 { fill: #9A978F; }
    #mains .t1 { fill: #BAB7B0; }
    #mains .t2 { fill: #E4E1DA; }
  </style>

  <script>
  /* ---------- Journal des visites ----------
     Une ligne dans Notion a l'ouverture du site, une par lien suivi. Le
     navigateur n'envoie qu'une cle ; c'est /api/evenement qui en fait un
     libelle, et qui y joint l'adresse IP, la ville et l'appareil - des choses
     que lui seul sait, et qu'on ne peut donc pas lui faire dire.

     sendBeacon plutot que fetch : la requete part meme si la page se ferme
     dans la foulee, et elle ne retarde jamais l'ouverture du lien. */
  (function () {
    function signaler(cle) {
      var corps = JSON.stringify({ evenement: cle });
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(
            "/api/evenement",
            new Blob([corps], { type: "application/json" })
          );
          return;
        }
        fetch("/api/evenement", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: corps,
          keepalive: true,
        }).catch(function () {});
      } catch (e) {
        // Le journal ne doit jamais abimer la page.
      }
    }

    signaler("site");

    // En capture : le compte est pris avant que le navigateur ne parte suivre
    // le lien.
    document.addEventListener(
      "click",
      function (e) {
        var lien = e.target.closest ? e.target.closest("a[data-evenement]") : null;
        if (lien) signaler(lien.getAttribute("data-evenement"));
      },
      true
    );
  })();

  /* Ouverture et fermeture de la fenetre Finder. Le genie fait l'animation
     quand il le peut ; sinon les classes CSS suffisent a montrer et cacher. */
  document.addEventListener("DOMContentLoaded", function () {
    var plaque = document.querySelector(".dossier-plaque");
    var bouton = document.getElementById("dossier-bouton");
    var overlay = document.getElementById("finder-overlay");
    var fenetre = overlay.querySelector(".finder-win");
    var cadre = fenetre.querySelector(".window");
    var css = document.getElementById("finder-css").textContent;
    var genie = window.createGenie ? window.createGenie({ duration: 620 }) : null;
    var petit = window.matchMedia("(max-width: 700px)");
    var ouvert = false;
    // De quoi savoir si le dernier geste venait du clavier ou du pointeur.
    var auClavier = false;
    document.addEventListener("keydown", function (e) {
      if (e.key === "Tab" || e.key === "Escape" || e.key === "Enter" || e.key === " ") {
        auClavier = true;
      }
    }, true);
    document.addEventListener("pointerdown", function () { auClavier = false; }, true);

    // La fenetre est dessinee en points macOS : 449 x 319. Elle garde cette
    // taille sur un ecran de reference, retrecit si l'ecran est plus petit, et
    // grandit a proportion s'il est plus grand. Cette derniere regle n'est pas
    // un luxe : sans elle, la fenetre serait deux fois plus petite a l'ecran
    // des que le navigateur est a 50 % de zoom, puisque ses 449 points sont des
    // pixels CSS. Le reste de la page etant en vw, elle y est maintenant
    // accordee.
    var LARGEUR_REFERENCE = 1512;
    function ajuster() {
      // Sur un petit ecran les lignes de la liste s'epaississent : la maquette
      // ne peut pas porter de media query, c'est donc ici que la bascule se
      // decide. La classe change la hauteur de la fenetre : on la pose avant
      // de mesurer.
      cadre.classList.toggle("tactile", petit.matches);

      // Le viewport visuel ne sert qu'a une chose : remonter la fenetre
      // au-dessus du clavier. Il retrecit aussi quand la barre d'adresse de
      // Safari va et vient, et quand on zoome a deux doigts - s'en servir
      // alors remettrait la fenetre a l'echelle et la ferait glisser pour
      // rien, ce qui se voit comme un saut puis un retour. Le seul cas qui
      // nous interesse se reconnait sans ambiguite : notre champ a le focus.
      var vv = window.visualViewport;
      var clavier =
        vv && document.activeElement === champ && window.innerHeight - vv.height > 100;
      var hDispo = clavier ? vv.height : window.innerHeight;
      var dy = clavier ? vv.offsetTop + vv.height / 2 - window.innerHeight / 2 : 0;
      overlay.style.setProperty("--finder-dy", dy.toFixed(1) + "px");

      var w = fenetre.offsetWidth, h = fenetre.offsetHeight;
      if (w && h) {
        var k = Math.min(
          (window.innerWidth - 32) / w,
          (hDispo - 32) / h,
          Math.max(1, window.innerWidth / LARGEUR_REFERENCE)
        );
        // L'echelle est arrondie vers le bas pour qu'une ligne de la liste
        // couvre un nombre entier de pixels de l'ecran. Sans cela la trame
        // zebree et les icones tombent entre deux pixels : elles scintillent
        // au repos et vibrent pendant qu'un dossier se replie. La perte est
        // d'au plus une ligne sur 60 ou 90, soit moins de 2 %.
        var grille =
          parseFloat(getComputedStyle(cadre).getPropertyValue("--rh")) *
          (window.devicePixelRatio || 1);
        var crans = Math.floor(k * grille);
        if (crans >= 1) k = crans / grille;
        overlay.style.setProperty("--finder-k", k.toFixed(6));
      }
      // Le bouton se cale sur la plaque telle qu'elle est dessinee. Il ne
      // peint rien : c'est une zone de clic, pas un element de design.
      var r = plaque.getBoundingClientRect();
      bouton.style.left = r.left + "px";
      bouton.style.top = r.top + "px";
      bouton.style.width = r.width + "px";
      bouton.style.height = r.height + "px";
    }

    function ouvrir() {
      if (ouvert) return;
      ouvert = true;
      ajuster();
      overlay.classList.add("ouvert");
      overlay.removeAttribute("aria-hidden");
      bouton.setAttribute("aria-expanded", "true");
      if (!genie) return focaliser();
      overlay.classList.add("anime");
      genie.open(fenetre, bouton.getBoundingClientRect(), css).then(function () {
        overlay.classList.remove("anime");
        focaliser();
      });
    }

    function fermer() {
      if (!ouvert) return;
      ouvert = false;
      bouton.setAttribute("aria-expanded", "false");
      function fin() {
        if (barre.classList.contains("ouverte")) chercher(false);
        overlay.classList.remove("ouvert", "anime");
        overlay.setAttribute("aria-hidden", "true");
        // Rendre le focus au dossier n'a de sens que pour qui navigue au
        // clavier. Apres un clic ou un appui, ca ne fait qu'allumer le lisere
        // bleu autour de la plaque sans que personne ne l'ait demande.
        if (auClavier) bouton.focus({ preventScroll: true });
      }
      if (!genie) return fin();
      overlay.classList.add("anime");
      // Le fond se dissipe pendant que le genie se resserre.
      overlay.classList.remove("ouvert");
      genie.close(fenetre, bouton.getBoundingClientRect(), css).then(fin);
    }

    // La fenetre est modale : le clavier doit y entrer a l'ouverture et
    // retrouver le dossier a la fermeture.
    function focaliser() {
      var premier = fenetre.querySelector(".row");
      if (premier) premier.focus({ preventScroll: true });
    }

    bouton.addEventListener("click", ouvrir);

    /* ---------- Recherche ----------
       La loupe etire sa pastille vers la gauche et devient un champ. Taper y
       filtre la liste : un lien reste si son nom contient la recherche, un
       dossier reste s'il garde au moins un lien, et tout son contenu reste si
       c'est le nom du dossier lui-meme qui repond. */
    var barre = fenetre.querySelector(".search");
    var loupe = fenetre.querySelector(".loupe");
    var champ = fenetre.querySelector(".champ");
    var groupes = [].slice.call(fenetre.querySelectorAll(".enfants"));
    var memoire = null;

    function texte(ligne) {
      return ligne.querySelector(".name").textContent.toLowerCase();
    }

    function filtrer() {
      var q = champ.value.trim().toLowerCase();
      // Une recherche deplie tous les dossiers, sinon elle ne trouverait que
      // ce qui est deja ouvert. L'etat d'avant est rendu en sortant.
      if (q && !memoire) {
        memoire = groupes.map(function (g) {
          return g.previousElementSibling.getAttribute("aria-expanded");
        });
      }
      var total = 0;
      groupes.forEach(function (g, i) {
        var titre = g.previousElementSibling;
        var tout = q !== "" && texte(titre).indexOf(q) !== -1;
        var vus = 0;
        [].forEach.call(g.children, function (l) {
          var ok = q === "" || tout || texte(l).indexOf(q) !== -1;
          l.classList.toggle("filtre", !ok);
          if (ok) vus++;
        });
        g.style.setProperty("--n", vus);
        titre.classList.toggle("filtre", q !== "" && vus === 0);
        titre.setAttribute(
          "aria-expanded",
          q ? "true" : memoire ? memoire[i] : "true"
        );
        total += vus;
      });
      if (!q) memoire = null;
      cadre.classList.toggle("sans-resultat", q !== "" && total === 0);
      retexturer();
    }

    function chercher(oui) {
      barre.classList.toggle("ouverte", oui);
      cadre.classList.toggle("cherche", oui);
      loupe.setAttribute("aria-expanded", String(oui));
      champ.tabIndex = oui ? 0 : -1;
      if (oui) {
        champ.focus({ preventScroll: true });
      } else {
        if (document.activeElement === champ) loupe.focus({ preventScroll: true });
        champ.value = "";
        filtrer();
      }
      retexturer();
    }

    loupe.addEventListener("click", function () {
      chercher(!barre.classList.contains("ouverte"));
    });

    /* La barre ne survit pas a la perte du champ : refermer le clavier, ou
       cliquer ailleurs, la referme. Une exception, et elle compte : si le
       geste qui fait perdre le focus est un appui sur une ligne, on ne touche
       a rien. Rendre la main a la liste complete pendant que le doigt est
       pose deplacerait la ligne visee avant que le clic n'arrive dessus. */
    var surLigne = false;
    fenetre.addEventListener("pointerdown", function (e) {
      surLigne = !!e.target.closest(".row");
    });
    champ.addEventListener("focus", function () { surLigne = false; });
    champ.addEventListener("blur", function () {
      // Sans delai : surLigne est deja connu, puisque le pointerdown qui fait
      // perdre le focus precede toujours le blur. Rien a attendre.
      if (surLigne) return;
      if (barre.classList.contains("ouverte")) chercher(false);
    });
    // Le clic sur un lien est passe : on peut refermer sans rien deplacer sous
    // le doigt.
    fenetre.addEventListener("click", function (e) {
      var lien = e.target.closest("a.row");
      if (lien && barre.classList.contains("ouverte")) chercher(false);
    });
    champ.addEventListener("input", function () {
      // genie.js rasterise la fenetre a partir de son outerHTML : sans
      // l'attribut, la capture montrerait un champ vide.
      champ.setAttribute("value", champ.value);
      filtrer();
    });

    // Toute retouche de la liste perime la texture du genie : on la refait une
    // fois les animations retombees.
    var reprise;
    function retexturer() {
      if (!genie) return;
      genie.invalidate();
      clearTimeout(reprise);
      reprise = setTimeout(function () {
        if (!ouvert) genie.prime(fenetre, css);
      }, 500);
    }

    // Les dossiers se replient au clic, comme dans le Finder.
    fenetre.addEventListener("click", function (e) {
      var d = e.target.closest(".dossier");
      if (!d) return;
      var ouvre = d.getAttribute("aria-expanded") === "false";
      d.setAttribute("aria-expanded", ouvre);
      // En repliant, le focus peut se retrouver sur un lien devenu invisible.
      if (!ouvre && d.nextElementSibling.contains(document.activeElement)) {
        d.focus({ preventScroll: true });
      }
      retexturer();
    });

    // Clic en dehors de la fenetre, et feu rouge de la barre de titre.
    overlay.addEventListener("click", function (e) {
      if (!fenetre.contains(e.target) || e.target.closest(".traffic .r")) fermer();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape" || !ouvert) return;
      // La recherche se referme avant la fenetre : on ne perd pas tout d'un coup.
      if (barre.classList.contains("ouverte")) chercher(false);
      else fermer();
    });

    // La fenetre se declare modale : le clavier doit y tourner en rond plutot
    // que de repartir dans la page masquee derriere.
    overlay.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var f = fenetre.querySelectorAll(".loupe, .champ, .row");
      // Les lignes ecartees par la recherche sont en display:none, celles d'un
      // dossier replie en visibility:hidden : le navigateur les saute deja,
      // encore faut-il savoir laquelle est vraiment la derniere.
      f = Array.prototype.filter.call(f, function (el) {
        return (
          el.getClientRects().length > 0 &&
          getComputedStyle(el).visibility !== "hidden" &&
          el.tabIndex >= 0
        );
      });
      if (!f.length) return;
      var premier = f[0], dernier = f[f.length - 1];
      if (e.shiftKey && document.activeElement === premier) {
        e.preventDefault();
        dernier.focus();
      } else if (!e.shiftKey && document.activeElement === dernier) {
        e.preventDefault();
        premier.focus();
      }
    });

    // Franchir le seuil change la hauteur des lignes, donc la fenetre entiere :
    // la texture du genie ne vaut plus rien.
    if (petit.addEventListener) {
      petit.addEventListener("change", function () {
        ajuster();
        if (genie) { genie.invalidate(); if (!ouvert) genie.prime(fenetre, css); }
      });
    }

    // Le clavier mobile n'emet pas de resize : c'est le viewport visuel qui
    // change. On le suit pour que la fenetre remonte au-dessus du clavier.
    if (window.visualViewport) {
      var image = 0;
      var suivre = function () {
        cancelAnimationFrame(image);
        image = requestAnimationFrame(ajuster);
      };
      window.visualViewport.addEventListener("resize", suivre);
      window.visualViewport.addEventListener("scroll", suivre);
    }

    var differe;
    window.addEventListener("resize", function () {
      if (genie) { genie.settle(); genie.invalidate(); }
      ajuster();
      clearTimeout(differe);
      differe = setTimeout(function () {
        if (genie && !ouvert) genie.prime(fenetre, css);
      }, 250);
    });

    ajuster();
    // Le bloc de texte change de hauteur quand SF Pro arrive, ce qui deplace
    // les mains, donc le dossier : on recale le bouton a ce moment-la.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(ajuster);
    }
    window.addEventListener("load", ajuster);

    // La texture est fabriquee au repos : le premier clic n'a plus rien a faire.
    if (genie) {
      var amorcer = function () { ajuster(); genie.prime(fenetre, css); };
      if (window.requestIdleCallback) requestIdleCallback(amorcer, { timeout: 2500 });
      else setTimeout(amorcer, 800);
    }
  });
  </script>
</body>
</html>
