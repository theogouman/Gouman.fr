  <style id="finder-css">
    /* finder:css:start */

  /* ============================================================
     Fenêtre Finder macOS (Liquid Glass, sombre)
     Unité de base : 1px = 1pt macOS. Taille réelle : 449 × 319.
     Les colonnes Taille et Type gardent leurs coordonnées d'origine (447 et
     544) : à cette largeur elles tombent au-delà du bord et sont rognées,
     exactement comme le Finder le fait quand on retrécit la fenêtre.
     Changez --scale pour agrandir sans perte de netteté.
     ============================================================ */
  .finder-win {
    --scale: 2;

    --win-bg: #1e1e1e;
    --glass-bg: rgba(255, 255, 255, 0.075);
    --glass-pill: rgba(255, 255, 255, 0.13);
    --stripe: rgba(255, 255, 255, 0.04);
    --select: #2a5bd2;

    --text: #ececec;
    --text-2: #c9c9c9;
    --text-3: #8d8d8d;
    --icon: #e6e6e6;
    --hairline: rgba(255, 255, 255, 0.09);

    --font: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont,
            "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .finder-win,

  .finder-win * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mise en page de cette page de previsualisation uniquement : le scopeur de
     scripts/build-finder.mjs jette cette regle lors de l'injection dans le site. */

  /* ---------- Fenêtre ---------- */
  .finder-win .window {
    position: relative;
    width: 449px;
    height: 319px;
    border-radius: 28px;
    background: var(--win-bg);
    overflow: hidden;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    letter-spacing: -0.08px;
    user-select: none;
    box-shadow:
      0 0 0 0.5px rgba(0, 0, 0, 0.55),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.16),
      0 24px 60px rgba(0, 0, 0, 0.32),
      0 8px 20px rgba(0, 0, 0, 0.22);
  }

  .finder-win svg { display: block; overflow: visible; }

  .finder-win .traffic {
    position: absolute;
    top: 19.5px; left: 19px;
    display: flex; gap: 9px;
    z-index: 5;
  }
  .finder-win .traffic span {
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
  }
  .finder-win .traffic .r { background: #ff5f57; }
  .finder-win .traffic .y { background: #febc2e; }
  .finder-win .traffic .g { background: #28c840; }

  /* ---------- Toolbar ---------- */
  .finder-win .glass {
    position: absolute;
    top: 8.5px; height: 36px;
    border-radius: 18px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.2),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.07),
      0 0 0 0.5px rgba(0, 0, 0, 0.35),
      0 1px 4px rgba(0, 0, 0, 0.25);
    color: var(--icon);
  }
  .finder-win .glass .ic {
    position: absolute; top: 8px;
    width: 20px; height: 20px;
    transform: translateX(-50%);
  }

  .finder-win .nav { left: 96px; width: 73px; }
  .finder-win .nav .sep {
    position: absolute; left: 36.5px; top: 10px;
    width: 0.5px; height: 16px; background: rgba(255, 255, 255, 0.14);
  }
  .finder-win .nav .dim { color: #7c7c7c; }

  .finder-win .title {
    position: absolute; left: 182px; top: 8.5px;
    line-height: 36px;
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.2px;
    color: #f2f2f2;
  }

  /* Trop etroite pour les groupes d'actions : le Finder les replie derriere
     un chevron double, comme ici. */
  .finder-win .plus { left: 359px; width: 36px; }
  .finder-win .search { left: 404px; width: 36px; }

  /* ---------- Liste ---------- */
  .finder-win .head {
    position: absolute; left: 0; right: 0; top: 56px;
    height: 24px;
    border-bottom: 0.5px solid var(--hairline);
    font-size: 12px;
  }
  .finder-win .head span { position: absolute; top: 0; line-height: 19px; }
  .finder-win .head .h-name { left: 48px; font-weight: 600; color: var(--text); }
  .finder-win .head .h-size { left: 447px; font-weight: 500; color: var(--text-3); }
  .finder-win .head .h-type { left: 544px; font-weight: 500; color: var(--text-3); }
  .finder-win .head .sort { left: 422px; top: 5.5px; color: var(--text-3); }
  .finder-win .head .div {
    position: absolute; top: 2px; width: 0.5px; height: 15px;
    background: rgba(255, 255, 255, 0.13);
  }

  /* La trame alternee est peinte par un degrade repete sur la liste, pas par
     les lignes : elle reste ainsi accrochee a la position a l'ecran, comme
     dans le Finder, y compris pendant qu'un dossier se replie. */
  .finder-win .rows {
    position: absolute; left: 0; right: 0; top: 85.5px;
    height: 200px;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 20px,
      var(--stripe) 20px 40px);
  }

  .finder-win .row {
    position: relative;
    display: block;
    width: 100%;
    border: 0;
    background: none;
    font: inherit;
    height: 20px; line-height: 20px;
    border-radius: 6px;
    color: var(--text);
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .finder-win .row:hover { background: rgba(255, 255, 255, 0.08); }
  .finder-win .row:active,
  .finder-win .row:focus-visible { background: var(--select); outline: none; }
  .finder-win .row:active .name,
  .finder-win .row:focus-visible .name { color: #fff; }

  .finder-win .row .disc { position: absolute; left: 16px; top: 5px; width: 7px; height: 10px; color: #b5b5b5; }
  .finder-win .row .ficon { position: absolute; left: 27px; top: 2px; width: 16px; height: 16px; }
  /* top explicite : sans lui le nom se poserait a sa position statique,
     qui depend du formatage du markup de la ligne. */
  .finder-win .row .name { position: absolute; left: 48px; top: 0; color: var(--text); }

  /* Un cran d'indentation pour le contenu d'un dossier. */
  .finder-win .row.enfant .ficon { left: 43px; }
  .finder-win .row.enfant .name { left: 64px; }

  /* Repliement : chaque ligne fait 20px, la hauteur du groupe est donc connue
     et animable. Le triangle pivote en meme temps, comme dans le Finder. */
  .finder-win .enfants {
    overflow: hidden;
    height: calc(var(--n) * 20px);
    visibility: visible;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s;
  }
  /* visibility bascule une fois le repliement fini : les liens caches sortent
     ainsi de l'ordre de tabulation, sans disparaitre pendant l'animation. */
  .finder-win .dossier[aria-expanded="false"] + .enfants {
    height: 0;
    visibility: hidden;
    transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1), visibility 0s 240ms;
  }

  .finder-win .dossier .disc {
    transform: rotate(90deg);
    transform-origin: 50% 50%;
    transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .finder-win .dossier[aria-expanded="false"] .disc { transform: rotate(0); }

  @media (prefers-reduced-motion: reduce) {
    .finder-win .enfants,
    .finder-win .dossier .disc { transition: none; }
  }

  /* ---------- Barre de chemin ---------- */
  .finder-win .pathbar {
    position: absolute; left: 0; right: 0; top: 291.5px; bottom: 0;
    border-top: 0.5px solid var(--hairline);
    display: flex; align-items: center;
    padding-left: 14px;
    font-size: 11.5px;
    color: #b4b4b4;
  }
  .finder-win .crumb { display: flex; align-items: center; gap: 5px; }
  .finder-win .crumb svg { width: 12px; height: 12px; }
  .finder-win .chev { width: 6px; height: 8px; margin: 0 5px 0 5px; color: #8a8a8a; }

    /* finder:css:end */
  </style>
  <style>
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/sf-pro-display-bold.woff2") format("woff2");
    }
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/sf-pro-display-regular.woff2") format("woff2");
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #F4F1EA;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      --marge: clamp(14px, 3.2vw, 60px);
      /* les mains ne touchent plus le bas de l'ecran */
      --bas: 3vh;
      --bas: 3dvh;
      /* Pleine largeur : la hauteur des mains en decoule, et c'est le titre qui
         cede la place. Le plafond ne mord que sur les fenetres tres plates
         (au-dela de 1.88:1), ou les mains retrecissent au lieu d'etre rognees. */
      --mains-h: min(41.5757vw, 78vh);
      --mains-h: min(41.5757vw, 78dvh);
      --haut: clamp(20px, 2.5vh, 48px);
      --haut: clamp(20px, 2.5dvh, 48px);
      --haut-dispo: calc(100vh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      --haut-dispo: calc(100dvh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      /* largeur commune au titre et a l'accroche : bornee par la largeur de
         l'ecran, par un maximum, et par la hauteur qui reste au-dessus des mains */
      --bloc: min(68.80vw, 960px, calc(var(--haut-dispo) * 3.3));
      height: 100vh;
      height: 100dvh;
      padding-bottom: var(--bas);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Le texte et les mains forment un bloc : les mains sont donc toujours
       posees juste sous le texte, et c'est le vide qui se repartit autour.
       Sur mobile, ou les mains sont bridees par la largeur, elles remontent
       ainsi avec le texte au lieu de rester collees en bas. */
    .texte-boite {
      flex: 0 0 auto;
      padding: var(--haut) var(--marge);
      display: flex;
      justify-content: center;
    }

    /* Le titre et l'accroche ont exactement la meme largeur d'encre : leur
       corps est calcule a partir de la largeur du bloc et de la largeur que
       chaque phrase occupe a 1 em (6.1218 em et 17.9229 em). */
    .titre {
      width: var(--bloc);
      text-align: center;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   system-ui, "Helvetica Neue", Arial, sans-serif;
    }

    .nom {
      margin: 0;
      font-weight: 700;
      font-size: calc(var(--bloc) * 0.163351);
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .accroche {
      margin: 0.34em 0 0;
      font-weight: 400;
      font-size: calc(var(--bloc) * 0.055795);
      line-height: 1.3;
      white-space: nowrap;
      color: #BAB7B0;
    }

    /* Le surlignage : un fond bleu qui s'ouvre de gauche a droite, avec une
       poignee a chaque bout. Celle de droite est posee dans le fond, elle le
       suit donc sans etre animee separement. */
    .surlignage {
      position: relative;
      color: #F4F1EA;
    }
    .surlignage .mot { position: relative; }

    .fond {
      position: absolute;
      left: 0;
      top: -0.16em;
      bottom: -0.12em;
      width: 0;
      background: #1A3F94;
      animation: surligner 900ms cubic-bezier(.4, 0, .2, 1) 700ms forwards;
    }

    .poignee {
      position: absolute;
      top: -0.16em;
      bottom: -0.12em;
      width: max(2px, 0.05em);
      background: #2F7BFF;
      opacity: 0;
    }
    .poignee::after {
      content: "";
      position: absolute;
      left: 50%;
      width: max(7px, 0.24em);
      height: max(7px, 0.24em);
      transform: translateX(-50%);
      border-radius: 50%;
      background: #2F7BFF;
    }
    .poignee.gauche        { left: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 260ms forwards; }
    .poignee.gauche::after { bottom: 100%; margin-bottom: max(-2px, -0.05em); }
    .poignee.droite        { right: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 700ms forwards; }
    .poignee.droite::after { top: 100%; margin-top: max(-2px, -0.05em); }

    @keyframes surligner { from { width: 0;   } to { width: 100%; } }
    @keyframes paraitre  { from { opacity: 0; } to { opacity: 1;   } }

    /* Si l'animation n'est pas souhaitee, on affiche directement l'etat final. */
    @media (prefers-reduced-motion: reduce) {
      .fond, .poignee {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
    }

    .mains-boite {
      flex: 0 0 auto;
      height: var(--mains-h);
      overflow: hidden;
    }
    .mains {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Les mains : IBM Plex Mono Bold, grille de 320 x 68 caracteres.
       Corps et interlettrage gardent le rapport glyphe/cellule du design. */
    #mains {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 18.281px;
      letter-spacing: 1.280px;
      font-variant-ligatures: none;
    }
    /* ---------- Le dossier, cible de clic ----------
       Le SVG des mains est aria-hidden : un vrai bouton est donc pose par
       dessus l'image du dossier, pour le clavier et les lecteurs d'ecran.
       Sa position est recalquee sur celle de l'image a chaque mise en page. */
    .dossier-bouton {
      position: fixed;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      border-radius: 12px;
      z-index: 10;
    }
    .visuellement-cache {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .dossier-bouton:focus-visible {
      outline: 2px solid #73D7FF;
      outline-offset: 6px;
    }

    /* ---------- La fenetre Finder ---------- */
    .finder-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
      backdrop-filter: blur(20px) saturate(125%);
      /* Fermee, elle reste mise en page : le genie doit pouvoir mesurer et
         rasteriser la fenetre avant le premier clic. Seuls l'affichage et les
         clics sont coupes. */
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease, visibility 0s linear 400ms;
    }
    .finder-overlay.ouvert {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 400ms ease;
    }

    /* Centrage par translation plutot que par grille : la boite de mise en
       page garde sa taille d'origine meme reduite, et une grille devrait alors
       centrer un element plus large qu'elle. Ici le centre tombe toujours au
       bon endroit, quelle que soit l'echelle. */
    .finder-win {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max-content;
      transform: translate(-50%, -50%) scale(var(--finder-k, 1));
      transition: transform 260ms ease, opacity 260ms ease;
    }
    /* Repli quand le genie ne tourne pas (WebGL absent, capture ratee,
       prefers-reduced-motion) : un simple fondu avec un leger retrait. */
    .finder-overlay:not(.ouvert):not(.anime) .finder-win {
      transform: translate(-50%, -50%) scale(calc(var(--finder-k, 1) * 0.92));
      opacity: 0;
    }
    /* Pendant le genie, la fenetre est dessinee par le canvas. */
    .finder-overlay.anime .finder-win { visibility: hidden; }

    .genie-canvas {
      position: fixed;
      inset: 0;
      z-index: 45;
      pointer-events: none;
      opacity: 0;
    }

    #mains .t0 { fill: #9A978F; }
    #mains .t1 { fill: #BAB7B0; }
    #mains .t2 { fill: #E4E1DA; }
  </style>
</head>
<body>

        <h1 class="nom">Théo Gouman</h1>
        <p class="accroche" lang="en">Building the <span class="surlignage"><span

          class="poignee gauche" aria-hidden="true"></i><span class="mot">ops systems</span></span> companies run on</p>
      </div>
    </div>

  /* Ouverture et fermeture de la fenetre Finder. Le genie fait l'animation

  document.addEventListener("DOMContentLoaded", function () {
    var dossier = document.querySelector(".dossier");
    var bouton = document.getElementById("dossier-bouton");
    var overlay = document.getElementById("finder-overlay");
    var fenetre = overlay.querySelector(".finder-win");
    var css = document.getElementById("finder-css").textContent;
    var genie = window.createGenie ? window.createGenie({ duration: 620 }) : null;
    var ouvert = false;

    // La fenetre fait 449 x 319 : elle s'affiche a sa taille native, comme une
    // vraie fenetre, et ne retrecit que si l'ecran est plus petit qu'elle.
    // Jamais agrandie : les coordonnees sont en points macOS, les etirer
    // trahirait le dessin.
    function ajuster() {
      var w = fenetre.offsetWidth, h = fenetre.offsetHeight;
      if (w && h) {
        var k = Math.min(
          (window.innerWidth - 32) / w,
          (window.innerHeight - 32) / h,
          1
        );
        overlay.style.setProperty("--finder-k", k.toFixed(4));
      }
      var r = dossier.getBoundingClientRect();
      bouton.style.left = r.left + "px";
      bouton.style.top = r.top + "px";
      bouton.style.width = r.width + "px";
      bouton.style.height = r.height + "px";
    }

    function ouvrir() {
      if (ouvert) return;
      ouvert = true;
      ajuster();
      overlay.classList.add("ouvert");
      overlay.removeAttribute("aria-hidden");
      bouton.setAttribute("aria-expanded", "true");
      if (!genie) return focaliser();
      overlay.classList.add("anime");
      genie.open(fenetre, dossier.getBoundingClientRect(), css).then(function () {
        overlay.classList.remove("anime");
        focaliser();
      });
    }

    function fermer() {
      if (!ouvert) return;
      ouvert = false;
      bouton.setAttribute("aria-expanded", "false");
      function fin() {
        overlay.classList.remove("ouvert", "anime");
        overlay.setAttribute("aria-hidden", "true");
        bouton.focus({ preventScroll: true });
      }
      if (!genie) return fin();
      overlay.classList.add("anime");
      // Le fond se dissipe pendant que le genie se resserre.
      overlay.classList.remove("ouvert");
      genie.close(fenetre, dossier.getBoundingClientRect(), css).then(fin);
    }

    // La fenetre est modale : le clavier doit y entrer a l'ouverture et
    // retrouver le dossier a la fermeture.
    function focaliser() {
      var premier = fenetre.querySelector(".row");
      if (premier) premier.focus({ preventScroll: true });
    }

    bouton.addEventListener("click", ouvrir);

    // Les dossiers se replient au clic, comme dans le Finder. L'arborescence
    // ayant change, la texture du genie ne vaut plus rien : on la refait une
    // fois l'animation de repliement terminee.
    var reprise;
    fenetre.addEventListener("click", function (e) {
      var d = e.target.closest(".dossier");
      if (!d) return;
      var ouvre = d.getAttribute("aria-expanded") === "false";
      d.setAttribute("aria-expanded", ouvre);
      // En repliant, le focus peut se retrouver sur un lien devenu invisible.
      if (!ouvre && d.nextElementSibling.contains(document.activeElement)) {
        d.focus({ preventScroll: true });
      }
      if (!genie) return;
      genie.invalidate();
      clearTimeout(reprise);
      reprise = setTimeout(function () { genie.prime(fenetre, css); }, 400);
    });

    // Clic en dehors de la fenetre, et feu rouge de la barre de titre.
    overlay.addEventListener("click", function (e) {
      if (!fenetre.contains(e.target) || e.target.closest(".traffic .r")) fermer();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && ouvert) fermer();
    });

    // La fenetre se declare modale : le clavier doit y tourner en rond plutot
    // que de repartir dans la page masquee derriere.
    overlay.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var f = fenetre.querySelectorAll(".row");
      // Les liens d'un dossier replie sont en visibility:hidden : le navigateur
      // les saute deja, encore faut-il savoir lequel est vraiment le dernier.
      f = Array.prototype.filter.call(f, function (el) {
        return getComputedStyle(el).visibility !== "hidden";
      });
      if (!f.length) return;
      var premier = f[0], dernier = f[f.length - 1];
      if (e.shiftKey && document.activeElement === premier) {
        e.preventDefault();
        dernier.focus();
      } else if (!e.shiftKey && document.activeElement === dernier) {
        e.preventDefault();
        premier.focus();
      }
    });

    var differe;
    window.addEventListener("resize", function () {
      if (genie) { genie.settle(); genie.invalidate(); }
      ajuster();
      clearTimeout(differe);
      differe = setTimeout(function () {
        if (genie && !ouvert) genie.prime(fenetre, css);
      }, 250);
    });

    ajuster();
    // Le bloc de texte change de hauteur quand SF Pro arrive, ce qui deplace
    // les mains, donc le dossier : on recale le bouton a ce moment-la.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(ajuster);
    }
    window.addEventListener("load", ajuster);

    // La texture est fabriquee au repos : le premier clic n'a plus rien a faire.
    if (genie) {
      var amorcer = function () { ajuster(); genie.prime(fenetre, css); };
      if (window.requestIdleCallback) requestIdleCallback(amorcer, { timeout: 2500 });
      else setTimeout(amorcer, 800);
    }
  });
  </script>
</body>
</html>
