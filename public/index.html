<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Théo Gouman — Building the ops systems companies run on</title>
  <meta name="description" content="Théo Gouman — Building the ops systems companies run on">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Théo Gouman">
  <meta property="og:description" content="Building the ops systems companies run on">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gouman.fr/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&text=%20%23%2B%2C.07%3A%3D%3F%40Ios~&display=swap" rel="stylesheet">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="fonts/sf-pro-display-bold.woff2">
  <style>
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/sf-pro-display-bold.woff2") format("woff2");
    }
    @font-face {
      font-family: "SF Pro Display";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/sf-pro-display-regular.woff2") format("woff2");
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #F4F1EA;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      --marge: clamp(14px, 3.2vw, 60px);
      /* les mains ne touchent plus le bas de l'ecran */
      --bas: 5vh;
      --bas: 5dvh;
      /* pleine largeur tant que la hauteur le permet, sinon rognees en haut */
      --mains-h: min(41.5757vw, 55vh);
      --mains-h: min(41.5757vw, 55dvh);
      --haut: 2.5vh;
      --haut: 2.5dvh;
      --haut-dispo: calc(100vh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      --haut-dispo: calc(100dvh - var(--mains-h) - var(--bas) - 2 * var(--haut));
      /* largeur commune au titre et a l'accroche : bornee par la largeur de
         l'ecran, par un maximum, et par la hauteur qui reste au-dessus des mains */
      --bloc: min(86vw, 1200px, calc(var(--haut-dispo) * 3.3592));
      position: relative;
      height: 100vh;
      height: 100dvh;
    }

    .texte-boite {
      position: absolute;
      inset: 0 0 calc(var(--mains-h) + var(--bas)) 0;
      padding: var(--haut) var(--marge);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Le titre et l'accroche ont exactement la meme largeur d'encre : leur
       corps est calcule a partir de la largeur du bloc et de la largeur que
       chaque phrase occupe a 1 em (6.1218 em et 17.9229 em). */
    .titre {
      width: var(--bloc);
      text-align: center;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   system-ui, "Helvetica Neue", Arial, sans-serif;
    }

    .nom {
      margin: 0;
      font-weight: 700;
      font-size: calc(var(--bloc) * 0.163351);
      line-height: 1.08;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .accroche {
      margin: 0.34em 0 0;
      font-weight: 400;
      font-size: calc(var(--bloc) * 0.055795);
      line-height: 1.3;
      white-space: nowrap;
      color: #BAB7B0;
    }

    /* Le surlignage : un fond bleu qui s'ouvre de gauche a droite, avec une
       poignee a chaque bout. Celle de droite est posee dans le fond, elle le
       suit donc sans etre animee separement. */
    .surlignage {
      position: relative;
      color: #F4F1EA;
    }
    .surlignage .mot { position: relative; }

    .fond {
      position: absolute;
      left: 0;
      top: -0.16em;
      bottom: -0.12em;
      width: 0;
      background: #1A3F94;
      animation: surligner 900ms cubic-bezier(.4, 0, .2, 1) 700ms forwards;
    }

    .poignee {
      position: absolute;
      top: -0.16em;
      bottom: -0.12em;
      width: max(2px, 0.05em);
      background: #2F7BFF;
      opacity: 0;
    }
    .poignee::after {
      content: "";
      position: absolute;
      left: 50%;
      width: max(7px, 0.24em);
      height: max(7px, 0.24em);
      transform: translateX(-50%);
      border-radius: 50%;
      background: #2F7BFF;
    }
    .poignee.gauche        { left: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 260ms forwards; }
    .poignee.gauche::after { bottom: 100%; margin-bottom: max(-2px, -0.05em); }
    .poignee.droite        { right: calc(-1 * max(2px, 0.05em));
                             animation: paraitre 240ms ease-out 700ms forwards; }
    .poignee.droite::after { top: 100%; margin-top: max(-2px, -0.05em); }

    @keyframes surligner { from { width: 0;   } to { width: 100%; } }
    @keyframes paraitre  { from { opacity: 0; } to { opacity: 1;   } }

    /* Si l'animation n'est pas souhaitee, on affiche directement l'etat final. */
    @media (prefers-reduced-motion: reduce) {
      .fond, .poignee {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
    }

    .mains-boite {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--bas);
      height: var(--mains-h);
      overflow: hidden;
    }
    .mains {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Les mains : IBM Plex Mono Bold, grille de 320 x 68 caracteres.
       Corps et interlettrage gardent le rapport glyphe/cellule du design. */
    #mains {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 18.281px;
      letter-spacing: 1.280px;
      font-variant-ligatures: none;
    }
    #mains .t0 { fill: #9A978F; }
    #mains .t1 { fill: #BAB7B0; }
    #mains .t2 { fill: #E4E1DA; }
  </style>
</head>

      </div>
