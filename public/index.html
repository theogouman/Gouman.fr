  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Gouman — Building Internet things">
  <meta property="og:description" content="Building Internet things — gouman.fr">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gouman.fr/">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&text=%20%22%23%24%2B%2C-.017%3A%3D%3F%40Iacefghimnorstu~&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #F4F1EA;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* L'ecran est decoupe en deux bandes dont la hauteur est calculee, pas
       negociee : les mains en bas, le titre dans ce qui reste. La page ne
       defile donc jamais, a aucune taille. */
    .scene {
      --marge: clamp(14px, 3.2vw, 60px);
      --mains-h: min(38.1951vw, 62vh);
      --mains-h: min(38.1951vw, 62dvh);
      position: relative;
      height: 100vh;
      height: 100dvh;
    }

    .texte-boite {
      position: absolute;
      inset: 0 0 var(--mains-h) 0;
      padding: var(--marge) var(--marge) calc(var(--marge) / 2);
      container-type: size;
      display: flex;
      align-items: center;
    }

    /* Le bloc titre garde les proportions du dessin (2045.5 x 1863.2 unites) et
       se met a l'echelle de la place disponible. Tout ce qu'il contient est
       positionne dans ces memes unites, via --u. */
    .titre {
      --u: min(92vw / 2045.5, 42vh / 1863.2);
      --u: min(100cqw / 2045.5, 100cqh / 1863.2);
      position: relative;
      width: calc(2045.5 * var(--u));
      height: calc(1863.2 * var(--u));
    }
    .titre > * { position: absolute; margin: 0; }

    .accroche {
      font-family: Inter, ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-style: normal;
      line-height: 1;
      white-space: nowrap;
      inset: 0;
      font-size: inherit;
    }
    .accroche .mot { position: absolute; }
    .mot-b { left: calc(94.01 * var(--u)); top: calc(-50.06 * var(--u)); font-size: calc(526.36 * var(--u)); letter-spacing: -0.0308em; }
    .mot-i { left: calc(114.19 * var(--u)); top: calc(503.83 * var(--u)); font-size: calc(553.58 * var(--u)); letter-spacing: -0.0854em; }
    .mot-t { left: calc(95.79 * var(--u)); top: calc(1160.19 * var(--u)); font-size: calc(526.36 * var(--u)); letter-spacing: -0.0308em; }
    .mot-i {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-style: italic;
    }

    .commit {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
      line-height: 1;
      white-space: pre;
    }
    .commit { left: calc(96.41 * var(--u)); top: calc(1782.26 * var(--u)); font-size: calc(73.20 * var(--u)); letter-spacing: -0.0543em; }

    /* Le surlignage bleu et ses poignees : des boites, pas du dessin. */
    .selection { background: #1A3F94; }
    .poignee   { background: #2F7BFF; }
    .rond      { background: #2F7BFF; border-radius: 50%; }

    .curseur { pointer-events: none; }

    /* Les mains vont d'un bord a l'autre, poignets colles aux cotes de l'ecran
       et posees sur le bas. Sur un ecran bas de plafond, le cadre se limite a
       62% de la hauteur et ce sont les doigts, en haut, qui sont rognes : la
       pleine largeur est preservee. */
    .mains-boite {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--mains-h);
      overflow: hidden;
    }
    .mains {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Les mains : IBM Plex Mono Bold, grille de 320 x 68 caracteres.
       Corps et interlettrage gardent le rapport glyphe/cellule du design. */
    #mains {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 18.281px;
      letter-spacing: 1.280px;
      font-variant-ligatures: none;
    }
    #mains .t0 { fill: #9A978F; }
    #mains .t1 { fill: #BAB7B0; }
    #mains .t2 { fill: #E4E1DA; }
  </style>
